# Copies Chromium's spell-check dictionaries and its flags into each account that lacks them, and marks its first run done.

C %h/.var/app/io.github.ungoogled_software.ungoogled_chromium/config/chromium/Dictionaries/en-AU-10-2.bdic - - - - /usr/share/koanga-workstation/chromium/dictionaries/en-AU-10-2.bdic
C %h/.var/app/io.github.ungoogled_software.ungoogled_chromium/config/chromium/Dictionaries/en-GB-10-2.bdic - - - - /usr/share/koanga-workstation/chromium/dictionaries/en-GB-10-2.bdic
C %h/.var/app/io.github.ungoogled_software.ungoogled_chromium/config/chromium-flags.conf - - - - /usr/share/koanga-workstation/chromium/chromium-flags.conf
f %h/.var/app/io.github.ungoogled_software.ungoogled_chromium/config/chromium/First\x20Run - - - -
