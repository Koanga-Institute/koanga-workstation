# Creates tuned's log folder with the SELinux label policy gives it and the folder for renamed launchers, and links Chromium's policies and add-ons into Flatpak.

d /var/log/tuned 0755 root root -
d /var/lib/koanga-workstation/launchers/applications 0755 root root -
L+ /var/lib/flatpak/extension/io.github.ungoogled_software.ungoogled_chromium.Policy.koanga/x86_64/1 - - - - /usr/share/koanga-workstation/chromium/policy
L+ /var/lib/flatpak/extension/io.github.ungoogled_software.ungoogled_chromium.Extension.koanga/x86_64/1 - - - - /usr/share/koanga-workstation/chromium/extension
