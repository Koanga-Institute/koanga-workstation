# Signs the Kōanga account in when a machine starts, and again thirty seconds after anyone signs out.

[daemon]
AutomaticLoginEnable=True
AutomaticLogin=koanga
TimedLoginEnable=True
TimedLogin=koanga
TimedLoginDelay=30
