name: Merge base image updates
on: pull_request_target

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge a new base image digest
    runs-on: ubuntu-26.04
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Read what the pull request updates
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Constraint: a merge made with GITHUB_TOKEN starts no workflow, so the build is started by hand.
      - name: Merge it and start the build
        if: ${{ contains(steps.metadata.outputs.package-ecosystem, 'docker') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --merge "${PR_URL}"
          gh workflow run build.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"
